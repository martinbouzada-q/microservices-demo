apiVersion: apps/v1
kind: Deployment
metadata:
  name: favoritesservice
  labels:
    app: favoritesservice
spec:
  selector:
    matchLabels:
      app: favoritesservice
  template:
    metadata:
      labels:
        app: favoritesservice
    spec:
      serviceAccountName: favoritesservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: favoritesservice
        imagePullPolicy: Never
        ports:
        - containerPort: 50052
        env:
        - name: PORT
          value: "50052"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        - name: ENABLE_TRACING
          value: "0"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: favoritesservice
  labels:
    app: favoritesservice
spec:
  type: ClusterIP
  selector:
    app: favoritesservice
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: favoritesservice
